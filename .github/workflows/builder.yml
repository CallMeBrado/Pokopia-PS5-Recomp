# A builder-v* tag publishes the standalone Windows executable. The first
# standalone release is the pinned source of the toolchain ZIP embedded in later builds.
name: Pokopia PS5 Builder

on:
  push:
    tags: ["builder-v*"]
  pull_request:
    paths: ["ps5/builder/**", ".github/workflows/builder.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  builder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the pipeline scripts
        shell: pwsh
        run: |
          python -m py_compile ps5/builder/pipeline.py ps5/builder/make-release.py `
            ps5/builder/make-toolchain-pack.py ps5/builder/mkpfs_exfat/exfat_writer.py `
            ps5/build/winbuild.py ps5/build/pack-shaders.py ps5/build/patch-lift.py
          python ps5/builder/pipeline.py --help

      - name: Check exFAT export
        shell: pwsh
        run: |
          @'
          import json
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          sys.path.insert(0, "ps5/builder")
          from mkpfs_exfat import write_exfat_image

          with TemporaryDirectory() as temp:
              root = Path(temp)
              title = root / "title"
              (title / "sce_sys").mkdir(parents=True)
              (title / "sce_sys/param.json").write_text(json.dumps({"titleId": "PPSA94010"}))
              payload = bytes(range(256)) * 1173
              (title / "eboot.bin").write_bytes(payload)
              image = write_exfat_image(title, root)
              with image.open("rb") as stream:
                  assert image.name == "PPSA94010.exfat"
                  assert stream.read(11)[3:] == b"EXFAT   "
                  assert payload in stream.read()
          '@ | python -

      - name: Build the window
        shell: pwsh
        run: dotnet build ps5/builder/app/PokopiaPS5Builder.csproj -c Release -o build/app

      - name: Fetch the pinned toolchain
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download builder-standalone-v1.0.0 --pattern PokopiaPS5Builder.exe --dir build/seed
          if ($LASTEXITCODE -ne 0) { throw "The initial standalone builder release is required to restore the pinned toolchain." }
          $sha = python -c "import runpy; print(runpy.run_path('ps5/builder/make-release.py')['TOOLCHAIN_SHA256'])"
          ./ps5/builder/standalone/extract-toolchain.ps1 -Launcher build/seed/PokopiaPS5Builder.exe -Out build/toolchain-1.zip -Sha256 $sha

      - name: Assemble the launcher payload
        shell: pwsh
        run: python ps5/builder/make-release.py --launcher-payload --app build/app --out dist --toolchain-zip build/toolchain-1.zip

      - name: Build the standalone executable
        shell: pwsh
        run: |
          $payload = (Resolve-Path dist/PokopiaPS5Builder-payload.zip).Path
          $toolchain = (Resolve-Path build/toolchain-1.zip).Path
          dotnet build ps5/builder/standalone/PokopiaPS5Builder.Standalone.csproj -c Release -o dist/standalone "-p:PayloadPath=$payload" "-p:ToolchainPath=$toolchain"

      - uses: actions/upload-artifact@v4
        with:
          name: PokopiaPS5Builder
          path: dist/standalone/PokopiaPS5Builder.exe
          compression-level: 0

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/builder-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Pokopia PS5 Builder: builds the PS5 version of Pokopia (PPSA94010) from your own dump of
          Pokopia 2.0.1 (update 655360). Open PokopiaPS5Builder.exe, pick your dump and an output
          folder, and choose a folder, exFAT, UFS2 .ffpkg, or FTP upload to your PS5. See README.txt.
          "@
          gh release create "${{ github.ref_name }}" dist/standalone/PokopiaPS5Builder.exe --title "Pokopia PS5 Builder ${{ github.ref_name }}" --notes $notes
